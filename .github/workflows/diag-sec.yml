name: diag-sec
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        run: |
          mkdir -p out
          printf "%s" "${{ secrets.SERVER_HOST }}" > out/SERVER_HOST
          printf "%s" "${{ secrets.SERVER_USER }}" > out/SERVER_USER
          printf "%s" "${{ secrets.SERVER_SSH_KEY }}" > out/SERVER_SSH_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: sec
          path: out
